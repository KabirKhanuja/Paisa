<script>
        let currentAmount = "0";
        let currentType = "subtract"; // default

        function updateDisplay() {
            const amountEl = document.getElementById('amount-text');
            const symbolEl = document.getElementById('currency-symbol');
            
            amountEl.innerText = currentAmount;
            
            if (currentType === 'subtract') {
                symbolEl.classList.remove('text-primary');
                symbolEl.classList.add('text-tertiary');
                amountEl.classList.add('text-on-surface');
            } else {
                symbolEl.classList.remove('text-tertiary');
                symbolEl.classList.add('text-primary');
            }
        }

        function appendNum(num) {
            if (currentAmount === "0" && num !== ".") {
                currentAmount = num;
            } else {
                // Prevent multiple decimals
                if (num === "." && currentAmount.includes(".")) return;
                // Limit decimals to 2 places
                if (currentAmount.includes(".") && currentAmount.split(".")[1].length >= 2) return;
                // Limit total length
                if (currentAmount.length >= 9) return;
                
                currentAmount += num;
            }
            updateDisplay();
        }

        function backspace() {
            if (currentAmount.length === 1) {
                currentAmount = "0";
            } else {
                currentAmount = currentAmount.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleType(type) {
            currentType = type;
            const addBtn = document.getElementById('btn-add');
            const subBtn = document.getElementById('btn-subtract');

            if (type === 'add') {
                addBtn.classList.add('bg-primary', 'text-on-primary');
                addBtn.classList.remove('text-on-surface-variant', 'hover:bg-primary/5');
                subBtn.classList.remove('bg-primary', 'text-on-primary');
                subBtn.classList.add('text-on-surface-variant', 'hover:bg-primary/5');
            } else {
                subBtn.classList.add('bg-primary', 'text-on-primary');
                subBtn.classList.remove('text-on-surface-variant', 'hover:bg-primary/5');
                addBtn.classList.remove('bg-primary', 'text-on-primary');
                addBtn.classList.add('text-on-surface-variant', 'hover:bg-primary/5');
            }
            updateDisplay();
        }
    </script>
